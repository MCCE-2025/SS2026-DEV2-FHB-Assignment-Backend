name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-skipped:
    name: Analyze (javascript-typescript)
    needs: changes
    if: always() && github.event_name == 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.src != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No application source changes — CodeQL scan skipped."
