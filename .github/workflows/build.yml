name: Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify syntax
        run: node --check index.js

      - name: Run tests with coverage
        run: npm test

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::warning::coverage/coverage-summary.json not found — skipping coverage summary."
            exit 0
          fi
          node -e '
            const { readFileSync } = require("node:fs");
            const data = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const t = data.total;
            const fmt = (m) => `${m.pct.toFixed(2)}% (${m.covered}/${m.total})`;
            const out = [
              "## Coverage summary",
              "",
              "| Metric | Coverage |",
              "|------------|----------|",
              `| Lines      | ${fmt(t.lines)} |`,
              `| Statements | ${fmt(t.statements)} |`,
              `| Functions  | ${fmt(t.functions)} |`,
              `| Branches   | ${fmt(t.branches)} |`,
              "",
              "_Full HTML report available as the `coverage-report` artifact._",
            ].join("\n");
            console.log(out);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
